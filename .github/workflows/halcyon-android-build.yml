name: Halcyon Android build

# Сборка libhalcyon_android.so (arm64) с линковкой. Запускается пушем в ветку halcyon/build* или вручную.
on:
  workflow_dispatch:
  push:
    branches: ["halcyon/build*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          key: android-arm64-fast

      - name: NDK environment
        run: |
          NDK="${ANDROID_NDK_HOME:-$ANDROID_NDK_LATEST_HOME}"
          TC="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          {
            echo "TC=$TC"
            echo "CC_aarch64_linux_android=$TC/aarch64-linux-android29-clang"
            echo "CXX_aarch64_linux_android=$TC/aarch64-linux-android29-clang++"
            echo "AR_aarch64_linux_android=$TC/llvm-ar"
            echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$TC/aarch64-linux-android29-clang"
          } >> "$GITHUB_ENV"
          echo "NDK: $NDK"

      - name: Build halcyon-android
        run: |
          set -o pipefail
          rustc --version
          cargo build -p halcyon-android --target aarch64-linux-android --profile fast --keep-going --message-format short 2>&1 | tee build.log

      - name: Build horizon-prepare and the Java launcher
        run: |
          set -o pipefail
          OUT=target/aarch64-linux-android/fast
          cargo build -p horizon-prepare --bin horizon-prepare --target aarch64-linux-android --profile fast --message-format short 2>&1 | tee prepare.log
          # The app runs these from its native library folder, so they are named lib*.so there.
          cp "$OUT/horizon-prepare" "$OUT/libhorizon_prepare.so"
          "$CC_aarch64_linux_android" -O2 -fPIE -pie -o "$OUT/libhalcyon_java.so" packaging/halcyon/java_launcher.c -ldl 2>&1 | tee -a prepare.log
          ls -la "$OUT/libhorizon_prepare.so" "$OUT/libhalcyon_java.so"

      - name: Inspect the library
        if: always()
        run: |
          SO=target/aarch64-linux-android/fast/libhalcyon_android.so
          {
            ls -la "$SO"
            "$TC/llvm-readelf" -h "$SO" | grep -E "Machine|Type"
            "$TC/llvm-readelf" -d "$SO" | grep -E "NEEDED|SONAME"
            "$TC/llvm-nm" -D "$SO" | grep -E "android_main|ANativeActivity_onCreate|GameActivity_onCreate" || true
            echo "TLS relocations:"
            "$TC/llvm-readelf" -r "$SO" | grep -E "TLS" | awk '{print $3}' | sort | uniq -c
          } 2>&1 | tee inspect.log || true
          # Android refuses to dlopen a library with initial-exec TLS (R_AARCH64_TLS_TPREL64).
          if "$TC/llvm-readelf" -r "$SO" | grep -q "TLS_TPREL"; then
            echo "The library has initial-exec TLS relocations: it cannot be dlopen'ed on Android" | tee -a inspect.log
            exit 1
          fi

      - name: Publish logs
        if: always()
        run: bash .github/halcyon-publish-log.sh "${{ github.token }}" build.log prepare.log inspect.log

      - name: Publish the library as a release (one per commit)
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SO=target/aarch64-linux-android/fast/libhalcyon_android.so
          SHORT="${GITHUB_SHA::7}"
          TAG="engine-${SHORT}"
          gh release delete "$TAG" -y --cleanup-tag || true
          gh release create "$TAG" "$SO" target/aarch64-linux-android/fast/libhorizon_prepare.so target/aarch64-linux-android/fast/libhalcyon_java.so --prerelease --target "$GITHUB_SHA" \
            --title "Horizon for Android (${SHORT})" \
            --notes "libhalcyon_android.so for arm64, build profile fast, built from ${GITHUB_SHA}. The Halcyon launcher downloads this file."
