[package]
name = "halcyon-android"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version = "1.90"
description = "Halcyon: the Android entry point of Horizon"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
horizon-client = { path = "../horizon-client" }
horizon-threads = { path = "../horizon-threads" }
winit = { version = "0.30.13", features = ["android-game-activity"] }
